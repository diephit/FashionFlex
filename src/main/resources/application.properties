spring.application.name=ff

spring.datasource.url=jdbc:mysql://localhost:3306/ff
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.web.resources.static-locations=classpath:/assets/,classpath:/static/
spring.mvc.static-path-pattern=/**

# JPA naming (use exact names, no snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# JWT configuration
jwt.secret=change_me_development_secret_key_please_override
jwt.expiration-ms=86400000
jwt.expiration=86400000
