# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://localhost:3306/ff
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET:change_me_development_secret_key_please_override}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===== GMAIL SMTP CONFIGURATION =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ===== CONTACT FORM CONFIGURATION =====
contact.recipient.email=${CONTACT_RECIPIENT_EMAIL:nnguyenkiet051205@gmail.com}

# ===== JPA/HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== FILE UPLOAD CONFIGURATION =====
# Static resources - combine classpath and external uploads directory
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Upload directories for different file types
app.upload.products-dir=uploads/products
app.upload.customers-dir=uploads/customers

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# ===== GOOGLE OAUTH2 CONFIGURATION =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub