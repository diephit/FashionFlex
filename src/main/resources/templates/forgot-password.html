<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Forgot Password - Fashion Flex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" th:href="@{/images/icons/favicon.png}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/fonts/font-awesome-4.7.0/css/font-awesome.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/util.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
	<style>
		.auth-container {
			min-height: calc(100vh - 200px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 80px 15px;
		}
		.auth-box {
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 0 30px rgba(0,0,0,0.1);
			max-width: 500px;
			width: 100%;
			padding: 40px;
		}
		.auth-header {
			text-align: center;
			margin-bottom: 30px;
		}
		.auth-header h2 {
			font-family: Poppins-Bold;
			font-size: 28px;
			color: #333;
			margin-bottom: 10px;
		}
		.auth-header p {
			font-family: Poppins-Regular;
			font-size: 14px;
			color: #666;
		}
		.form-input {
			width: 100%;
			height: 50px;
			border: 1px solid #e6e6e6;
			border-radius: 5px;
			padding: 0 20px;
			font-family: Poppins-Regular;
			font-size: 15px;
			color: #333;
			margin-bottom: 20px;
		}
		.form-input:focus {
			outline: none;
			border-color: #717fe0;
		}
		.btn-submit {
			width: 100%;
			height: 50px;
			background: #717fe0;
			border: none;
			border-radius: 5px;
			font-family: Poppins-Medium;
			font-size: 15px;
			color: #fff;
			cursor: pointer;
			transition: all 0.3s;
			text-transform: uppercase;
		}
		.btn-submit:hover {
			background: #333;
		}
		.back-link {
			text-align: center;
			margin-top: 20px;
			font-family: Poppins-Regular;
			font-size: 14px;
		}
		.back-link a {
			color: #717fe0;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<div class="auth-container">
		<div class="auth-box">
			<div class="auth-header">
				<h2>Forgot Password?</h2>
				<p>Enter your email address and we'll send you a verification code</p>
			</div>

			<!-- Error Message -->
			<div th:if="${error}" class="alert alert-danger" style="padding: 12px 20px; margin-bottom: 20px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;" th:text="${error}"></div>

			<form th:action="@{/forgot-password/send-code}" method="post">
				<input type="email" name="email" class="form-input" placeholder="Enter your email address" required>
				<button type="submit" class="btn-submit">Send Verification Code</button>
			</form>

			<div class="back-link">
				<a th:href="@{/login}">
					<i class="fa fa-arrow-left"></i> Back to Login
				</a>
			</div>
		</div>
	</div>
</body>
</html>
