<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Forgot Password - FashionFlex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
	<link rel="icon" type="image/png" href="images/icons/favicon.png"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="fonts/iconic/css/material-design-iconic-font.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="css/util.css">
	<link rel="stylesheet" type="text/css" href="css/main.css">
<!--===============================================================================================-->
	<style>
		/* Custom styles for forgot password page */
		.forgot-container {
			min-height: calc(100vh - 300px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 80px 15px;
		}

		.forgot-box {
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 0 30px rgba(0,0,0,0.1);
			max-width: 500px;
			width: 100%;
			padding: 50px 40px;
		}

		.forgot-header {
			text-align: center;
			margin-bottom: 30px;
		}

		.forgot-header h2 {
			font-family: Poppins-Medium;
			font-size: 28px;
			color: #333;
			margin-bottom: 10px;
		}

		.forgot-header p {
			font-family: Poppins-Regular;
			font-size: 14px;
			color: #666;
			line-height: 1.6;
		}

		.form-group {
			margin-bottom: 25px;
		}

		.form-input {
			width: 100%;
			height: 50px;
			border: 1px solid #e6e6e6;
			border-radius: 5px;
			padding: 0 20px;
			font-family: Poppins-Regular;
			font-size: 15px;
			color: #333;
			transition: all 0.3s;
		}

		.form-input:focus {
			outline: none;
			border-color: #717fe0;
			box-shadow: 0 0 5px rgba(113, 127, 224, 0.3);
		}

		.form-input::placeholder {
			color: #999;
		}

		.btn-submit {
			width: 100%;
			height: 50px;
			background: #717fe0;
			border: none;
			border-radius: 5px;
			font-family: Poppins-Medium;
			font-size: 15px;
			color: #fff;
			cursor: pointer;
			transition: all 0.3s;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.btn-submit:hover {
			background: #333;
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(0,0,0,0.2);
		}

		.back-link {
			text-align: center;
			margin-top: 20px;
			font-family: Poppins-Regular;
			font-size: 14px;
		}

		.back-link a {
			color: #717fe0;
			text-decoration: none;
			font-family: Poppins-Medium;
		}

		.back-link a:hover {
			text-decoration: underline;
		}

		.alert {
			padding: 12px 15px;
			border-radius: 5px;
			margin-bottom: 20px;
			font-family: Poppins-Regular;
			font-size: 14px;
		}

		.alert-success {
			background: #d4edda;
			color: #155724;
			border: 1px solid #c3e6cb;
		}

		.alert-error {
			background: #f8d7da;
			color: #721c24;
			border: 1px solid #f5c6cb;
		}

		@media (max-width: 576px) {
			.forgot-box {
				padding: 40px 25px;
			}

			.forgot-header h2 {
				font-size: 24px;
			}
		}
	</style>
</head>
<body class="animsition">

	<!-- Header (Simple) -->
	<header>
		<div class="container-menu-desktop">
			<div class="wrap-menu-desktop">
				<nav class="limiter-menu-desktop container">
					<a href="/" class="logo">
						<img src="images/icons/logo-01.png" alt="IMG-LOGO">
					</a>
				</nav>
			</div>
		</div>
	</header>

	<!-- Forgot Password Section -->
	<div class="forgot-container">
		<div class="forgot-box">
			<div class="forgot-header">
				<h2>Forgot Password?</h2>
				<p>Enter your email address and we'll send you a link to reset your password.</p>
			</div>

			<!-- Success Message -->
			<div th:if="${message}" class="alert alert-success">
				<span th:text="${message}"></span>
			</div>

			<!-- Error Message -->
			<div th:if="${error}" class="alert alert-error">
				<span th:text="${error}"></span>
			</div>

			<form th:action="@{/forgot-password}" method="post">
				<div class="form-group">
					<input type="email" name="email" class="form-input" placeholder="Email Address" required autofocus>
				</div>

				<button type="submit" class="btn-submit">
					Send Reset Link
				</button>
			</form>

			<div class="back-link">
				<a th:href="@{/login}">Back to Login</a>
			</div>
		</div>
	</div>

	<!-- Footer -->
	<footer class="bg3 p-t-40 p-b-32">
		<div class="container">
			<p class="stext-107 cl6 txt-center">
				Copyright &copy;<script>document.write(new Date().getFullYear());</script> FashionFlex. All rights reserved.
			</p>
		</div>
	</footer>

<!--===============================================================================================-->
	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/animsition/js/animsition.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
<!--===============================================================================================-->
	<script src="js/main.js"></script>

</body>
</html>
