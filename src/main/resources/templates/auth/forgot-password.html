<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Forgot Password')}"></head>
<style>
    /* Forgot Password Page Styles */
    .forgot-container {
        min-height: calc(100vh - 400px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 15px;
    }
    .forgot-box {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 100%;
        padding: 40px;
    }
    .forgot-header h2 {
        font-family: Poppins-Bold;
        font-size: 28px;
        color: #333;
        margin-bottom: 15px;
        text-align: center;
    }
    .forgot-header p {
        font-family: Poppins-Regular;
        font-size: 14px;
        color: #666;
        text-align: center;
        margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 25px;
    }
    .form-input {
        width: 100%;
        height: 50px;
        border: 1px solid #e6e6e6;
        border-radius: 5px;
        padding: 0 20px;
        font-family: Poppins-Regular;
        font-size: 15px;
        color: #333;
        transition: all 0.3s;
    }
    .form-input:focus {
        outline: none;
        border-color: #717fe0;
        box-shadow: 0 0 5px rgba(113, 127, 224, 0.3);
    }
    .btn-submit {
        width: 100%;
        height: 50px;
        background: #717fe0;
        border: none;
        border-radius: 5px;
        font-family: Poppins-Medium;
        font-size: 15px;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn-submit:hover {
        background: #333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .back-link {
        text-align: center;
        margin-top: 20px;
        font-family: Poppins-Regular;
        font-size: 14px;
    }
    .back-link a {
        color: #717fe0;
        text-decoration: none;
    }
    .back-link a:hover {
        text-decoration: underline;
    }
    .alert {
        padding: 12px 20px;
        border-radius: 5px;
        margin-bottom: 20px;
        font-family: Poppins-Regular;
        font-size: 14px;
    }
    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .alert-danger {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
<body class="animsition">

<!-- Header -->
<div th:replace="~{fragments/header :: header('')}"></div>

<!-- Forgot Password Section -->
<div class="forgot-container">
    <div class="forgot-box">
        <div class="forgot-header">
            <h2>Forgot Password?</h2>
            <p>Enter your email address and we'll send you a verification code to reset your password.</p>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <input type="email" name="email" class="form-input" placeholder="Email Address" required autofocus>
            </div>

            <button type="submit" class="btn-submit">
                Send Verification Code
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/login}">Back to Login</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<div th:replace="~{fragments/header :: scripts}"></div>

</body>
</html>
