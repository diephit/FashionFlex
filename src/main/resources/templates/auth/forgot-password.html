<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Forgot Password')}"></head>
<body class="animsition">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Forgot Password Section -->
<div class="forgot-container">
    <div class="forgot-box">
        <div class="forgot-header">
            <h2>Forgot Password?</h2>
            <p>Enter your email address and we'll send you a verification code to reset your password.</p>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <input type="email" name="email" class="form-input" placeholder="Email Address" required autofocus>
            </div>

            <button type="submit" class="btn-submit">
                Send Verification Code
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/login}">Back to Login</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<div th:replace="~{fragments/header :: scripts}"></div>

</body>
</html>
