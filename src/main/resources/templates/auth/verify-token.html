<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Verify Token')}"></head>
<style>
    /* Verify Token Page Styles - Luxury Black & White Theme */
    .forgot-container {
        min-height: calc(100vh - 400px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 15px;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }
    .forgot-box {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(26, 26, 26, 0.08);
        max-width: 520px;
        width: 100%;
        padding: 48px;
        border: 1px solid #e9ecef;
    }
    .forgot-header h2 {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 32px;
        color: #1a1a1a;
        margin-bottom: 16px;
        text-align: center;
        letter-spacing: -0.5px;
    }
    .forgot-header p {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        font-size: 15px;
        color: #6c757d;
        text-align: center;
        margin-bottom: 12px;
        line-height: 1.6;
    }
    .forgot-header p:last-child {
        font-size: 13px;
        color: #6c757d;
        margin-bottom: 0;
    }
    .forgot-header strong {
        color: #1a1a1a;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 28px;
        position: relative;
    }
    .form-input {
        width: 100%;
        height: 56px;
        border: 2px solid #e9ecef;
        border-radius: 12px;
        padding: 0 20px;
        font-family: 'Poppins', sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-align: center;
        letter-spacing: 10px;
        background: #fafbfc;
    }
    .form-input:focus {
        outline: none;
        border-color: #1a1a1a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
    }
    .form-input::placeholder {
        color: #6c757d;
        font-weight: 400;
        letter-spacing: 2px;
    }
    .btn-submit {
        width: 100%;
        height: 56px;
        background: #1a1a1a;
        border: none;
        border-radius: 12px;
        font-family: 'Poppins', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
    }
    .btn-submit:hover {
        background: #2d2d2d;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(26, 26, 26, 0.15);
    }
    .btn-submit:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(26, 26, 26, 0.1);
    }
    .btn-resend {
        background: #6c757d;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-resend:hover:not(:disabled) {
        background: #5a6268;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(108, 117, 125, 0.15);
    }
    .btn-resend:disabled {
        background: #dee2e6;
        color: #495057;
        cursor: not-allowed;
        opacity: 0.7;
    }
    .back-link {
        text-align: center;
        margin-top: 28px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 400;
    }
    .back-link a {
        color: #1a1a1a;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    .back-link a:hover {
        color: #2d2d2d;
        text-decoration: underline;
    }
    .alert {
        padding: 16px 24px;
        border-radius: 12px;
        margin-bottom: 24px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 500;
        border: none;
    }
    .alert-success {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
    }
    .alert-danger {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
    }
    .alert-info {
        background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        color: #0d47a1;
    }
</style>
<body class="animsition">

<!-- Header -->
<div th:replace="~{fragments/header :: header('')}"></div>

<!-- Verify Token Section -->
<div class="forgot-container">
    <div class="forgot-box">
        <div class="forgot-header">
            <h2>Verify Your Email</h2>
            <p>A 6-digit verification code has been sent to <strong th:text="${email}"></strong></p>
            <p style="font-size: 0.9em; color: #666;">Code expires in 5 minutes</p>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <!-- Remaining Attempts Info -->
        <div th:if="${remainingAttempts != null}" class="alert alert-info">
            <span th:text="'Remaining attempts: ' + ${remainingAttempts}"></span>
        </div>

        <form th:action="@{/verify-token}" method="post">
            <input type="hidden" name="email" th:value="${email}" />
            <div class="form-group">
                <input type="text" name="token" class="form-input" placeholder="Enter 6-digit code"
                       maxlength="6" pattern="[0-9]{6}" required autofocus>
            </div>

            <button type="submit" class="btn-submit">
                Verify Code
            </button>
        </form>

        <!-- Resend Code Section -->
        <div style="text-align: center; margin-top: 20px;">
            <button id="resendBtn" class="btn-resend" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                Resend Code
            </button>
            <p id="cooldownText" style="font-size: 0.9em; color: #666; margin-top: 10px; display: none;"></p>
        </div>

        <div class="back-link">
            <a th:href="@{/login}">Back to Login</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<div th:replace="~{fragments/header :: scripts}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const userEmail = /*[[${email}]]*/ '';
    /*]]>*/
</script>
<script th:src="@{/js/verify-token.js}"></script>

</body>
</html>
