<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Verify Token')}"></head>
<style>
    /* Verify Token Page Styles */
    .forgot-container {
        min-height: calc(100vh - 400px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 15px;
    }
    .forgot-box {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 100%;
        padding: 40px;
    }
    .forgot-header h2 {
        font-family: Poppins-Bold;
        font-size: 28px;
        color: #333;
        margin-bottom: 15px;
        text-align: center;
    }
    .forgot-header p {
        font-family: Poppins-Regular;
        font-size: 14px;
        color: #666;
        text-align: center;
        margin-bottom: 10px;
    }
    .form-group {
        margin-bottom: 25px;
    }
    .form-input {
        width: 100%;
        height: 50px;
        border: 1px solid #e6e6e6;
        border-radius: 5px;
        padding: 0 20px;
        font-family: Poppins-Regular;
        font-size: 18px;
        color: #333;
        transition: all 0.3s;
        text-align: center;
        letter-spacing: 8px;
    }
    .form-input:focus {
        outline: none;
        border-color: #717fe0;
        box-shadow: 0 0 5px rgba(113, 127, 224, 0.3);
    }
    .btn-submit {
        width: 100%;
        height: 50px;
        background: #717fe0;
        border: none;
        border-radius: 5px;
        font-family: Poppins-Medium;
        font-size: 15px;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn-submit:hover {
        background: #333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .btn-resend {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-family: Poppins-Medium;
        font-size: 14px;
        transition: all 0.3s;
    }
    .btn-resend:hover:not(:disabled) {
        background-color: #5a6268;
        transform: translateY(-2px);
        box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    .btn-resend:disabled {
        background-color: #999;
        cursor: not-allowed;
        opacity: 0.6;
    }
    .back-link {
        text-align: center;
        margin-top: 20px;
        font-family: Poppins-Regular;
        font-size: 14px;
    }
    .back-link a {
        color: #717fe0;
        text-decoration: none;
    }
    .back-link a:hover {
        text-decoration: underline;
    }
    .alert {
        padding: 12px 20px;
        border-radius: 5px;
        margin-bottom: 20px;
        font-family: Poppins-Regular;
        font-size: 14px;
    }
    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .alert-danger {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .alert-info {
        background-color: #e3f2fd;
        color: #1976d2;
        border: 1px solid #90caf9;
    }
</style>
<body class="animsition">

<!-- Header -->
<div th:replace="~{fragments/header :: header('')}"></div>

<!-- Verify Token Section -->
<div class="forgot-container">
    <div class="forgot-box">
        <div class="forgot-header">
            <h2>Verify Your Email</h2>
            <p>A 6-digit verification code has been sent to <strong th:text="${email}"></strong></p>
            <p style="font-size: 0.9em; color: #666;">Code expires in 5 minutes</p>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <!-- Remaining Attempts Info -->
        <div th:if="${remainingAttempts != null}" class="alert alert-info" style="background-color: #e3f2fd; color: #1976d2; border: 1px solid #90caf9; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
            <span th:text="'Remaining attempts: ' + ${remainingAttempts}"></span>
        </div>

        <form th:action="@{/verify-token}" method="post">
            <input type="hidden" name="email" th:value="${email}" />
            <div class="form-group">
                <input type="text" name="token" class="form-input" placeholder="Enter 6-digit code"
                       maxlength="6" pattern="[0-9]{6}" required autofocus>
            </div>

            <button type="submit" class="btn-submit">
                Verify Code
            </button>
        </form>

        <!-- Resend Code Section -->
        <div style="text-align: center; margin-top: 20px;">
            <button id="resendBtn" class="btn-resend" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                Resend Code
            </button>
            <p id="cooldownText" style="font-size: 0.9em; color: #666; margin-top: 10px; display: none;"></p>
        </div>

        <div class="back-link">
            <a th:href="@{/login}">Back to Login</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<div th:replace="~{fragments/header :: scripts}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const userEmail = /*[[${email}]]*/ '';
    /*]]>*/
</script>
<script th:src="@{/js/verify-token.js}"></script>

</body>
</html>
