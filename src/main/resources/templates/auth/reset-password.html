<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Reset Password')}"></head>
<style>
    /* Reset Password Page Styles - Luxury Black & White Theme */
    .forgot-container {
        min-height: calc(100vh - 400px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 15px;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }
    .forgot-box {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(26, 26, 26, 0.08);
        max-width: 520px;
        width: 100%;
        padding: 48px;
        border: 1px solid #e9ecef;
    }
    .forgot-header h2 {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 32px;
        color: #1a1a1a;
        margin-bottom: 16px;
        text-align: center;
        letter-spacing: -0.5px;
    }
    .forgot-header p {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        font-size: 15px;
        color: #6c757d;
        text-align: center;
        margin-bottom: 36px;
        line-height: 1.6;
    }
    .form-group {
        margin-bottom: 28px;
        position: relative;
    }
    .form-input {
        width: 100%;
        height: 56px;
        border: 2px solid #e9ecef;
        border-radius: 12px;
        padding: 0 20px;
        font-family: 'Poppins', sans-serif;
        font-size: 15px;
        font-weight: 400;
        color: #1a1a1a;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: #fafbfc;
    }
    .form-input:focus {
        outline: none;
        border-color: #1a1a1a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
    }
    .form-input::placeholder {
        color: #6c757d;
        font-weight: 400;
    }
    .btn-submit {
        width: 100%;
        height: 56px;
        background: #1a1a1a;
        border: none;
        border-radius: 12px;
        font-family: 'Poppins', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
    }
    .btn-submit:hover {
        background: #2d2d2d;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(26, 26, 26, 0.15);
    }
    .btn-submit:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(26, 26, 26, 0.1);
    }
    .back-link {
        text-align: center;
        margin-top: 28px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 400;
    }
    .back-link a {
        color: #1a1a1a;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    .back-link a:hover {
        color: #2d2d2d;
        text-decoration: underline;
    }
    .alert {
        padding: 16px 24px;
        border-radius: 12px;
        margin-bottom: 24px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 500;
        border: none;
    }
    .alert-success {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
    }
    .alert-danger {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
    }
</style>
<body class="animsition">

<!-- Header -->
<div th:replace="~{fragments/header :: header('')}"></div>

<!-- Reset Password Section -->
<div class="forgot-container">
    <div class="forgot-box">
        <div class="forgot-header">
            <h2>Reset Your Password</h2>
            <p>Please enter your new password below.</p>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}" />
            <div class="form-group">
                <input type="password" name="password" class="form-input" placeholder="New Password" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="confirmPassword" class="form-input" placeholder="Confirm New Password" required>
            </div>

            <button type="submit" class="btn-submit">
                Reset Password
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/login}">Back to Login</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<div th:replace="~{fragments/header :: scripts}"></div>

</body>
</html>
