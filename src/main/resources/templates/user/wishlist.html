<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Wishlist - FashionFlex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
	<link rel="icon" type="image/png" th:href="@{/images/icons/favicon.png}"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/fonts/font-awesome-4.7.0/css/font-awesome.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/fonts/iconic/css/material-design-iconic-font.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/fonts/linearicons-v1.0.0/icon-font.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/animate/animate.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/css-hamburgers/hamburgers.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/animsition/css/animsition.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/select2/select2.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/perfect-scrollbar/perfect-scrollbar.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/util.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/assets/css/pages/user-pages.css}">
<!--===============================================================================================-->
</head>
<body class="animsition" th:attr="data-authenticated=${isAuthenticated}">

	<!-- Header -->
	<div th:replace="~{fragments/header :: header('home')}"></div>

	<!-- Cart -->
	<div th:replace="~{fragments/header :: cart}"></div>

	<!-- Main Content -->
	<div class="user-account-wrapper">
		<div class="container">
			<div class="row">
				<!-- Sidebar Navigation -->
				<div class="col-md-3">
					<div th:replace="~{fragments/user-sidebar :: sidebar('wishlist')}"></div>
				</div>

				<!-- Main Content -->
				<div class="col-md-9">
					<div class="user-account-content">
						<div class="user-account-header">
							<div class="flex-w flex-sb-m">
								<div>
									<h2>My Wishlist</h2>
									<p>Your favorite products saved for later</p>
								</div>
								<div th:if="${wishlistCount > 0}">
									<span class="stext-111 cl6">
										<span th:text="${wishlistCount}">0</span> item(s)
									</span>
									<button class="btn btn-sm btn-outline-danger ml-3" onclick="clearWishlist()">
										<i class="fa fa-trash"></i> Clear All
									</button>
								</div>
							</div>
						</div>

						<!-- Empty State -->
						<div th:if="${wishlistCount == 0}" class="text-center p-t-80 p-b-80">
							<i class="fa fa-heart-o" style="font-size: 80px; color: #ccc;"></i>
							<h4 class="mtext-105 cl2 m-t-20">Your wishlist is empty</h4>
							<p class="stext-113 cl6 m-t-10 m-b-20">Save your favorite items for later!</p>
							<a th:href="@{/products}" class="btn-user-primary">
								<i class="fa fa-shopping-bag"></i> Continue Shopping
							</a>
						</div>

						<!-- Wishlist Grid -->
						<div th:if="${wishlistCount > 0}" class="wishlist-grid">
							<!-- Wishlist Item -->
							<div class="wishlist-item"
								 th:each="item : ${wishlistItems}"
								 th:id="'wishlist-item-' + ${item.id}">
								<div class="wishlist-item-image">
									<a th:href="@{'/product/' + ${item.productId}}">
										<img th:src="${item.productImageUrl != null ? item.productImageUrl : '/images/product-placeholder.jpg'}"
											 th:alt="${item.productName}"
											 onerror="this.src='/images/product-placeholder.jpg'">
									</a>
									<button class="wishlist-remove"
											th:onclick="'removeFromWishlist(' + ${item.id} + ')'"
											title="Remove from wishlist">
										<i class="fa fa-times"></i>
									</button>

									<!-- Out of Stock Badge -->
									<div th:if="${!item.inStock}" class="product-badge badge-danger">
										Out of Stock
									</div>

									<!-- Discount Badge -->
									<div th:if="${item.hasDiscount && item.inStock}" class="product-badge badge-success">
										-<span th:text="${item.discountPercentage}">0</span>%
									</div>
								</div>
								<div class="wishlist-item-info">
									<a th:href="@{'/product/' + ${item.productId}}" style="text-decoration: none; color: inherit;">
										<h4 th:text="${item.productName}">Product Name</h4>
									</a>

									<!-- Category & Brand -->
									<div class="stext-112 cl6 m-b-8">
										<span th:if="${item.categoryName}" th:text="${item.categoryName}">Category</span>
										<span th:if="${item.categoryName != null and item.brandName != null}"> | </span>
										<span th:if="${item.brandName}" th:text="${item.brandName}">Brand</span>
									</div>

									<!-- Price -->
									<div class="wishlist-item-price">
										<span th:if="${item.hasDiscount}" class="text-muted" style="text-decoration: line-through; margin-right: 8px;">
											$<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">0.00</span>
										</span>
										<span th:classappend="${item.hasDiscount ? 'text-danger font-weight-bold' : ''}">
											$<span th:text="${#numbers.formatDecimal(item.effectivePrice, 1, 2)}">0.00</span>
										</span>
									</div>

									<!-- Stock Status -->
									<div th:if="${!item.inStock}" class="text-danger m-b-10">
										<small><i class="fa fa-exclamation-circle"></i> Currently unavailable</small>
									</div>

									<!-- Added Date -->
									<div class="stext-112 cl6 m-b-10">
										<small>Added: <span th:text="${#temporals.format(item.addedAt, 'MMM dd, yyyy')}">Date</span></small>
									</div>

									<!-- Action Button -->
									<button class="btn-user-primary move-to-cart-btn"
											style="width: 100%;"
											th:disabled="${!item.inStock}"
											th:data-wishlist-id="${item.id}"
											th:data-has-variants="${item.hasVariants}"
											th:data-product-name="${item.productName}"
											th:attr="data-sizes=${item.availableSizes != null and !item.availableSizes.isEmpty() ? #strings.setJoin(item.availableSizes, ','): ''},
													 data-colors=${item.availableColors != null and !item.availableColors.isEmpty() ? #strings.setJoin(item.availableColors, ','): ''}">
										<i class="fa fa-shopping-cart"></i>
										<span th:text="${item.inStock ? 'Move to Cart' : 'Out of Stock'}">Move to Cart</span>
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Footer -->
	<div th:replace="~{fragments/footer :: footer}"></div>

	<!-- Back to top -->
	<div class="btn-back-to-top" id="myBtn">
		<span class="symbol-btn-back-to-top">
			<i class="zmdi zmdi-chevron-up"></i>
		</span>
	</div>

<!--===============================================================================================-->
	<script th:src="@{/vendor/jquery/jquery-3.2.1.min.js}"></script>
	<script th:src="@{/vendor/animsition/js/animsition.min.js}"></script>
	<script th:src="@{/vendor/bootstrap/js/popper.js}"></script>
	<script th:src="@{/vendor/bootstrap/js/bootstrap.min.js}"></script>
	<script th:src="@{/vendor/select2/select2.min.js}"></script>
	<script th:src="@{/vendor/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
	<script>
		$('.js-pscroll').each(function(){
			$(this).css('position','relative');
			$(this).css('overflow','hidden');
			var ps = new PerfectScrollbar(this, {
				wheelSpeed: 1,
				scrollingThreshold: 1000,
				wheelPropagation: false,
			});

			$(window).on('resize', function(){
				ps.update();
			})
		});
	</script>
	<script th:src="@{/js/main.js}"></script>
	<script th:src="@{/js/wishlist.js}"></script>

</body>
</html>
