<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Reset Password - Fashion Flex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" th:href="@{/images/icons/favicon.png}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/fonts/font-awesome-4.7.0/css/font-awesome.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/util.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
	<style>
		.auth-container {
			min-height: calc(100vh - 200px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 80px 15px;
		}
		.auth-box {
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 0 30px rgba(0,0,0,0.1);
			max-width: 500px;
			width: 100%;
			padding: 40px;
		}
		.auth-header {
			text-align: center;
			margin-bottom: 30px;
		}
		.auth-header h2 {
			font-family: Poppins-Bold;
			font-size: 28px;
			color: #333;
			margin-bottom: 10px;
		}
		.auth-header p {
			font-family: Poppins-Regular;
			font-size: 14px;
			color: #666;
		}
		.form-input {
			width: 100%;
			height: 50px;
			border: 1px solid #e6e6e6;
			border-radius: 5px;
			padding: 0 20px;
			font-family: Poppins-Regular;
			font-size: 15px;
			color: #333;
			margin-bottom: 20px;
		}
		.form-input:focus {
			outline: none;
			border-color: #717fe0;
		}
		.btn-submit {
			width: 100%;
			height: 50px;
			background: #717fe0;
			border: none;
			border-radius: 5px;
			font-family: Poppins-Medium;
			font-size: 15px;
			color: #fff;
			cursor: pointer;
			transition: all 0.3s;
			text-transform: uppercase;
		}
		.btn-submit:hover {
			background: #333;
		}
		.password-requirements {
			font-family: Poppins-Regular;
			font-size: 12px;
			color: #666;
			margin-bottom: 20px;
			padding: 10px;
			background: #f5f5f5;
			border-radius: 5px;
		}
	</style>
</head>
<body>
	<div class="auth-container">
		<div class="auth-box">
			<div class="auth-header">
				<div style="font-size: 48px; color: #717fe0; margin-bottom: 15px;">
					<i class="fa fa-lock"></i>
				</div>
				<h2>Reset Password</h2>
				<p>Enter your new password below</p>
			</div>

			<!-- Error Message -->
			<div th:if="${error}" class="alert alert-danger" style="padding: 12px 20px; margin-bottom: 20px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;" th:text="${error}"></div>

			<form th:action="@{/reset-password}" method="post" onsubmit="return validatePassword()">
				<input type="hidden" name="email" th:value="${email}">
				<input type="hidden" name="code" th:value="${code}">
				
				<div class="password-requirements">
					<i class="fa fa-info-circle"></i> Password must be at least 6 characters long
				</div>

				<input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="New Password" required minlength="6">
				
				<input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm New Password" required minlength="6">
				
				<div id="passwordError" style="display: none; color: #721c24; font-size: 12px; margin-bottom: 15px; font-family: Poppins-Regular;"></div>

				<button type="submit" class="btn-submit">
					<i class="fa fa-check"></i> Reset Password
				</button>
			</form>
		</div>
	</div>

	<script>
		function validatePassword() {
			const newPassword = document.getElementById('newPassword').value;
			const confirmPassword = document.getElementById('confirmPassword').value;
			const errorDiv = document.getElementById('passwordError');

			if (newPassword.length < 6) {
				errorDiv.textContent = 'Password must be at least 6 characters long';
				errorDiv.style.display = 'block';
				return false;
			}

			if (newPassword !== confirmPassword) {
				errorDiv.textContent = 'Passwords do not match';
				errorDiv.style.display = 'block';
				return false;
			}

			errorDiv.style.display = 'none';
			return true;
		}

		// Real-time password match validation
		document.getElementById('confirmPassword').addEventListener('input', function() {
			const newPassword = document.getElementById('newPassword').value;
			const confirmPassword = this.value;
			const errorDiv = document.getElementById('passwordError');

			if (confirmPassword && newPassword !== confirmPassword) {
				errorDiv.textContent = 'Passwords do not match';
				errorDiv.style.display = 'block';
			} else {
				errorDiv.style.display = 'none';
			}
		});
	</script>
</body>
</html>
