<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(${category.id != null ? 'Edit Category' : 'Add Category'})}"></head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Fragment -->
            <div th:replace="~{admin/fragments/sidebar :: sidebar('categories')}"></div>

            <div class="col-md-10 main-content">
                <h1 th:text="${category.id != null} ? 'Edit Category' : 'Add New Category'">Category Form</h1>

                <div class="form-card">
                    <form method="post" th:action="@{/admin/categories/save}" th:object="${category}">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Category Name *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fa fa-save"></i> Save
                        </button>
                        <a href="/admin/categories" class="btn btn-secondary">
                            <i class="fa fa-times"></i> Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <th:block th:replace="~{admin/fragments/scripts :: scripts}"></th:block>
</body>
</html>
