<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(${product.id != null ? 'Edit Product' : 'Add Product'})}"></head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Fragment -->
            <div th:replace="~{admin/fragments/sidebar :: sidebar('products')}"></div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <h1 class="mb-4" th:text="${product.id != null} ? 'Edit Product' : 'Add New Product'">Product Form</h1>

                <div class="form-card">
                    <!-- Display errors -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form method="post" th:action="@{/admin/products/save}" th:object="${product}" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Product Name *</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="sku" class="form-label">SKU (auto-generated if empty)</label>
                                <input type="text" class="form-control" id="sku" th:field="*{sku}"
                                       placeholder="Leave empty for auto-generation">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="categoryId" class="form-label">Category *</label>
                                <select class="form-control" id="categoryId" th:field="*{categoryId}"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}">Category</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="brandId" class="form-label">Brand</label>
                                <select class="form-control" id="brandId" th:field="*{brandId}">
                                    <option value="">-- Select Brand --</option>
                                    <option th:each="brand : ${brands}"
                                            th:value="${brand.id}"
                                            th:text="${brand.name}">Brand</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="stock" class="form-label">Stock Quantity *</label>
                                <input type="number" class="form-control" id="stock"
                                       th:field="*{stock}" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Price ($) *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="price"
                                       th:field="*{price}" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="discountPrice" class="form-label">Discount Price ($)</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="discountPrice"
                                       th:field="*{discountPrice}">
                                <small class="text-muted">Leave empty if no discount</small>
                            </div>
                        </div>

                        <!-- Image Upload Section -->
                        <div class="mb-3">
                            <h5>Product Images</h5>
                            <hr>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="mainImage" class="form-label">Main Image</label>
                                <input type="file" class="form-control" id="mainImage" name="mainImage" accept="image/*">
                                <small class="text-muted">JPG, PNG, GIF (Max 5MB)</small>
                                <div th:if="${product.imageUrl}" class="mt-2">
                                    <img th:src="@{${product.imageUrl}}" alt="Current image"
                                         style="max-width: 200px; max-height: 200px; object-fit: cover;">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="additionalImagesUpload" class="form-label">Additional Images</label>
                                <input type="file" class="form-control" id="additionalImagesUpload"
                                       name="additionalImagesUpload" accept="image/*" multiple>
                                <small class="text-muted">You can select multiple images</small>
                            </div>
                        </div>

                        <!-- Variants Section -->
                        <div class="mb-3">
                            <h5>Product Variants</h5>
                            <hr>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="sizesInput" class="form-label">Available Sizes</label>
                                <input type="text" class="form-control" id="sizesInput" th:field="*{sizesInput}"
                                       placeholder="e.g., S, M, L, XL, XXL">
                                <small class="text-muted">Enter sizes separated by commas</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="colorsInput" class="form-label">Available Colors</label>
                                <input type="text" class="form-control" id="colorsInput" th:field="*{colorsInput}"
                                       placeholder="e.g., Red, Blue, Black, White">
                                <small class="text-muted">Enter colors separated by commas</small>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="active"
                                           th:field="*{active}">
                                    <label class="form-check-label" for="active">Active</label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="featured"
                                           th:field="*{featured}">
                                    <label class="form-check-label" for="featured">Featured</label>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save"></i> Save Product
                            </button>
                            <a href="/admin/products" class="btn btn-secondary">
                                <i class="fa fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <th:block th:replace="~{admin/fragments/scripts :: scripts}"></th:block>
</body>
</html>
