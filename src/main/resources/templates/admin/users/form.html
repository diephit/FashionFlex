<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('User Details')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Fragment -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar('users')}"></div>

        <div class="col-md-10 main-content">
            <h1>User Details</h1>

            <div class="form-card">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div th:if="${user}">
                    <table class="table table-bordered mb-4">
                        <tr>
                            <th>ID</th>
                            <td th:text="${user.id}"></td>
                        </tr>
                        <tr>
                            <th>Full Name</th>
                            <td th:text="${user.fullName}"></td>
                        </tr>
                        <tr>
                            <th>Email</th>
                            <td th:text="${user.email}"></td>
                        </tr>
                        <tr>
                            <th>Phone Number</th>
                            <td th:text="${user.phoneNumber}"></td>
                        </tr>
                        <tr>
                            <th>Address</th>
                            <td th:text="${user.address}"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td>
                                <span th:text="${user.enabled ? 'Active' : 'Inactive'}" th:class="${user.enabled ? 'badge bg-success' : 'badge bg-danger'}"></span>
                            </td>
                        </tr>
                        <tr>
                            <th>Roles</th>
                            <td>
                                <span th:each="role : ${user.roles}" class="badge bg-primary me-1" th:text="${role}"></span>
                            </td>
                        </tr>
                    </table>

                    <hr>

                    <div class="row">
                        <div class="col-md-6">
                            <h4>Assign Role</h4>
                            <form th:action="@{/admin/users/assign-role/{id}(id=${user.id})}" method="post" class="d-flex">
                                <input type="text" name="roleName" class="form-control me-2" placeholder="Enter role name (e.g., ADMIN)">
                                <button type="submit" class="btn btn-primary">Assign</button>
                            </form>
                        </div>
                        <div class="col-md-6">
                            <h4>Remove Role</h4>
                            <div th:each="role : ${user.roles}">
                                <a th:href="@{/admin/users/remove-role/{userId}/{roleName}(userId=${user.id}, roleName=${role})}" class="btn btn-sm btn-danger mb-2">
                                    Remove <span th:text="${role}"></span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <a href="/admin/users" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> Back to List</a>
                </div>

                <div th:if="${user == null}">
                    <p class="text-danger">User not found.</p>
                    <a href="/admin/users" class="btn btn-secondary">Back to List</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts Fragment -->
<th:block th:replace="~{admin/fragments/scripts :: scripts}"></th:block>
</body>
</html>
