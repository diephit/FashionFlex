
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>User Management</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th><a th:href="@{/admin/users(sortBy='id', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">ID</a></th>
            <th><a th:href="@{/admin/users(sortBy='fullName', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">Full Name</a></th>
            <th><a th:href="@{/admin/users(sortBy='email', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">Email</a></th>
            <th>Roles</th>
            <th><a th:href="@{/admin/users(sortBy='enabled', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">Status</a></th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${#strings.arrayJoin(user.roles, ', ')}"></td>
            <td>
                <span th:text="${user.enabled ? 'Active' : 'Inactive'}"
                      th:class="${user.enabled ? 'badge badge-success' : 'badge badge-danger'}"></span>
            </td>
            <td>
                <a th:href="@{/admin/users/view/{id}(id=${user.id})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/admin/users/toggle/{id}(id=${user.id})}" class="btn btn-sm btn-warning">Toggle Status</a>
                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, sortBy=${sortBy}, sortDir=${sortDir})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/admin/users(page=${i}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, sortBy=${sortBy}, sortDir=${sortDir})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
