
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - View User</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>User Details</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${user}">
        <table class="table table-bordered">
            <tr>
                <th>ID</th>
                <td th:text="${user.id}"></td>
            </tr>
            <tr>
                <th>Full Name</th>
                <td th:text="${user.fullName}"></td>
            </tr>
            <tr>
                <th>Email</th>
                <td th:text="${user.email}"></td>
            </tr>
            <tr>
                <th>Phone Number</th>
                <td th:text="${user.phoneNumber}"></td>
            </tr>
            <tr>
                <th>Address</th>
                <td th:text="${user.address}"></td>
            </tr>
            <tr>
                <th>Status</th>
                <td>
                    <span th:text="${user.enabled ? 'Active' : 'Inactive'}"
                          th:class="${user.enabled ? 'badge badge-success' : 'badge badge-danger'}"></span>
                </td>
            </tr>
            <tr>
                <th>Roles</th>
                <td>
                    <span th:each="role : ${user.roles}" class="badge badge-primary mr-1" th:text="${role}"></span>
                </td>
            </tr>
        </table>

        <hr>

        <div class="row">
            <div class="col-md-6">
                <h3>Assign Role</h3>
                <form th:action="@{/admin/users/assign-role/{id}(id=${user.id})}" method="post">
                    <div class="input-group">
                        <input type="text" name="roleName" class="form-control" placeholder="Enter role name (e.g., ADMIN)">
                        <div class="input-group-append">
                            <button type="submit" class="btn btn-primary">Assign</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <h3>Remove Role</h3>
                <div th:each="role : ${user.roles}">
                    <a th:href="@{/admin/users/remove-role/{userId}/{roleName}(userId=${user.id}, roleName=${role})}" class="btn btn-sm btn-danger mb-2">
                        Remove <span th:text="${role}"></span>
                    </a>
                </div>
            </div>
        </div>

        <hr>
        <a href="/admin/users" class="btn btn-secondary">Back to User List</a>
    </div>

    <div th:if="${user == null}">
        <p class="text-danger">User not found.</p>
    </div>
</div>
</body>
</html>
