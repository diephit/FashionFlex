<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Home - FashionFlex</title>
    <link rel="stylesheet" type="text/css" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/util.css">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
    <style>
        .user-home-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 15px;
        }
        .welcome-box {
            background: #fff;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }
        .welcome-box h1 {
            color: #717fe0;
            margin-bottom: 20px;
            font-size: 36px;
        }
        .user-info {
            margin: 30px 0;
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
        }
        .user-info p {
            margin: 10px 0;
            font-size: 16px;
        }
        .btn-logout {
            background: #717fe0;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: #333;
            color: white;
        }
        .btn-shop {
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            margin-left: 10px;
        }
        .btn-shop:hover {
            background: #218838;
            color: white;
        }
    </style>
</head>
<body>
    <div class="user-home-container">
        <div class="welcome-box">
            <h1>Welcome to FashionFlex!</h1>

            <div th:if="${user}" class="user-info">
                <p><strong>Name:</strong> <span th:text="${user.fullName}"></span></p>
                <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                <p><strong>Account Type:</strong> <span th:text="${user.provider}"></span></p>
                <p><strong>Member Since:</strong> <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"></span></p>
            </div>

            <div th:unless="${user}">
                <p>You are successfully logged in!</p>
            </div>

            <div style="margin-top: 30px;">
                <a href="/product" class="btn-shop">Start Shopping</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout" style="cursor: pointer;">Logout</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
