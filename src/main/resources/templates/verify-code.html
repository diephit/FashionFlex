<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Verify Code - Fashion Flex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" th:href="@{/images/icons/favicon.png}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/fonts/font-awesome-4.7.0/css/font-awesome.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/util.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
	<style>
		.auth-container {
			min-height: calc(100vh - 200px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 80px 15px;
		}
		.auth-box {
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 0 30px rgba(0,0,0,0.1);
			max-width: 500px;
			width: 100%;
			padding: 40px;
		}
		.auth-header {
			text-align: center;
			margin-bottom: 30px;
		}
		.auth-header h2 {
			font-family: Poppins-Bold;
			font-size: 28px;
			color: #333;
			margin-bottom: 10px;
		}
		.auth-header p {
			font-family: Poppins-Regular;
			font-size: 14px;
			color: #666;
			line-height: 1.6;
		}
		.email-display {
			background: #f5f5f5;
			padding: 10px 15px;
			border-radius: 5px;
			margin-bottom: 20px;
			text-align: center;
			font-family: Poppins-Medium;
			color: #717fe0;
		}
		.form-input {
			width: 100%;
			height: 50px;
			border: 1px solid #e6e6e6;
			border-radius: 5px;
			padding: 0 20px;
			font-family: Poppins-Regular;
			font-size: 18px;
			color: #333;
			margin-bottom: 20px;
			text-align: center;
			letter-spacing: 5px;
		}
		.form-input:focus {
			outline: none;
			border-color: #717fe0;
		}
		.btn-submit {
			width: 100%;
			height: 50px;
			background: #717fe0;
			border: none;
			border-radius: 5px;
			font-family: Poppins-Medium;
			font-size: 15px;
			color: #fff;
			cursor: pointer;
			transition: all 0.3s;
			text-transform: uppercase;
		}
		.btn-submit:hover {
			background: #333;
		}
		.resend-link {
			text-align: center;
			margin-top: 15px;
			font-family: Poppins-Regular;
			font-size: 14px;
			color: #666;
		}
		.resend-link a {
			color: #717fe0;
			text-decoration: none;
		}
		.resend-link a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<div class="auth-container">
		<div class="auth-box">
			<div class="auth-header">
				<div style="font-size: 48px; color: #717fe0; margin-bottom: 15px;">
					<i class="fa fa-envelope-o"></i>
				</div>
				<h2>Check Your Email</h2>
				<p th:if="${message}" th:text="${message}"></p>
				<p th:unless="${message}">We have sent a 6-digit verification code to your email</p>
			</div>

			<div class="email-display" th:if="${email}" th:text="${email}"></div>

			<!-- Error Message -->
			<div th:if="${error}" class="alert alert-danger" style="padding: 12px 20px; margin-bottom: 20px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;" th:text="${error}"></div>

			<form th:action="@{/verify-code}" method="post">
				<input type="hidden" name="email" th:value="${email}">
				<input type="text" name="code" class="form-input" placeholder="000000" required maxlength="6" pattern="[0-9]{6}">
				<button type="submit" class="btn-submit">Verify Code</button>
			</form>

			<div class="resend-link">
				Didn't receive the code? 
				<a th:href="@{/forgot-password}">Resend Code</a>
			</div>
		</div>
	</div>

	<script>
		// Auto-focus on code input
		document.querySelector('input[name="code"]').focus();
		
		// Allow only numbers
		document.querySelector('input[name="code"]').addEventListener('input', function(e) {
			this.value = this.value.replace(/[^0-9]/g, '');
		});
	</script>
</body>
</html>
