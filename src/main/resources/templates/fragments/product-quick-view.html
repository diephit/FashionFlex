<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quick View</title>
</head>
<body>

<!-- Quick View Modal Content Fragment -->
<div th:fragment="modal-content">
    <div class="row">
        <div class="col-md-6 col-lg-7 p-b-30">
            <div class="p-l-25 p-r-30 p-lr-0-lg">
                <div class="wrap-slick3 flex-sb flex-w">
                    <div class="wrap-slick3-dots"></div>
                    <div class="wrap-slick3-arrows flex-sb-m flex-w"></div>

                    <div class="slick3 gallery-lb">
                        <!-- Main product image -->
                        <div class="item-slick3"
                             th:data-thumb="${product.imageUrl != null && !product.imageUrl.isEmpty() ? product.imageUrl : '/images/product-placeholder.jpg'}">
                            <div class="wrap-pic-w pos-relative">
                                <img th:src="${product.imageUrl != null && !product.imageUrl.isEmpty() ? product.imageUrl : '/images/product-placeholder.jpg'}"
                                     alt="IMG-PRODUCT"
                                     onerror="this.onerror=null; this.src='/images/product-placeholder.jpg'">

                                <a class="flex-c-m size-108 how-pos1 bor0 fs-16 cl10 bg0 hov-btn3 trans-04"
                                   th:href="${product.imageUrl != null && !product.imageUrl.isEmpty() ? product.imageUrl : '/images/product-placeholder.jpg'}">
                                    <i class="fa fa-expand"></i>
                                </a>
                            </div>
                        </div>

                        <!-- Additional images -->
                        <div th:each="image : ${product.additionalImages}"
                             class="item-slick3"
                             th:data-thumb="${image}">
                            <div class="wrap-pic-w pos-relative">
                                <img th:src="${image}"
                                     alt="IMG-PRODUCT"
                                     onerror="this.onerror=null; this.src='/images/product-placeholder.jpg'">

                                <a class="flex-c-m size-108 how-pos1 bor0 fs-16 cl10 bg0 hov-btn3 trans-04"
                                   th:href="${image}">
                                    <i class="fa fa-expand"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-5 p-b-30">
            <div class="p-r-50 p-t-5 p-lr-0-lg">
                <!-- Product Name -->
                <h4 class="mtext-105 cl2 js-name-detail p-b-14" th:text="${product.name}">
                    Lightweight Jacket
                </h4>

                <!-- Price Display -->
                <span class="mtext-106 cl2" th:text="'$' + ${product.effectivePrice}">
                    $58.79
                </span>

                <!-- Description -->
                <p class="stext-102 cl3 p-t-23" th:text="${product.description != null && !product.description.isEmpty() ? product.description : 'No description available'}">
                    Nulla eget sem vitae eros pharetra viverra. Nam vitae luctus ligula. Mauris consequat ornare feugiat.
                </p>

                <!--  -->
                <div class="p-t-33">
                    <!-- Size Selector -->
                    <div class="flex-w flex-r-m p-b-10" th:if="${product.availableSizes != null && !product.availableSizes.isEmpty()}">
                        <div class="size-203 flex-c-m respon6">
                            Size
                        </div>

                        <div class="size-204 respon6-next">
                            <div class="rs1-select2 bor8 bg0">
                                <select class="js-select2" name="size">
                                    <option>Choose an option</option>
                                    <option th:each="size : ${product.availableSizes}"
                                            th:value="${size}"
                                            th:text="'Size ' + ${size}">Size S</option>
                                </select>
                                <div class="dropDownSelect2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Color Selector -->
                    <div class="flex-w flex-r-m p-b-10" th:if="${product.availableColors != null && !product.availableColors.isEmpty()}">
                        <div class="size-203 flex-c-m respon6">
                            Color
                        </div>

                        <div class="size-204 respon6-next">
                            <div class="rs1-select2 bor8 bg0">
                                <select class="js-select2" name="color">
                                    <option>Choose an option</option>
                                    <option th:each="color : ${product.availableColors}"
                                            th:value="${color}"
                                            th:text="${color}">Red</option>
                                </select>
                                <div class="dropDownSelect2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Quantity and Add to Cart -->
                    <div class="flex-w flex-r-m p-b-10">
                        <div class="size-204 flex-w flex-m respon6-next">
                            <div class="wrap-num-product flex-w m-r-20 m-tb-10">
                                <div class="btn-num-product-down cl8 hov-btn3 trans-04 flex-c-m">
                                    <i class="fs-16 zmdi zmdi-minus"></i>
                                </div>

                                <input class="mtext-104 cl3 txt-center num-product"
                                       type="number"
                                       name="num-product"
                                       value="1"
                                       min="1"
                                       th:max="${product.stock}">

                                <div class="btn-num-product-up cl8 hov-btn3 trans-04 flex-c-m">
                                    <i class="fs-16 zmdi zmdi-plus"></i>
                                </div>
                            </div>

                            <button class="flex-c-m stext-101 cl0 size-101 bg1 bor1 hov-btn1 p-lr-15 trans-04 js-addcart-detail"
                                    th:data-product-id="${product.id}">
                                Add to cart
                            </button>
                        </div>
                    </div>
                </div>

                <!--  -->
                <div class="flex-w flex-m p-l-100 p-t-40 respon7">
                    <div class="flex-m bor9 p-r-10 m-r-11">
                        <a href="#"
                           class="fs-14 cl3 hov-cl1 trans-04 lh-10 p-lr-5 p-tb-2 js-addwish-detail tooltip100"
                           data-tooltip="Add to Wishlist">
                            <i class="zmdi zmdi-favorite"></i>
                        </a>
                    </div>

                    <a href="#" class="fs-14 cl3 hov-cl1 trans-04 lh-10 p-lr-5 p-tb-2 m-r-8 tooltip100" data-tooltip="Facebook">
                        <i class="fa fa-facebook"></i>
                    </a>

                    <a href="#" class="fs-14 cl3 hov-cl1 trans-04 lh-10 p-lr-5 p-tb-2 m-r-8 tooltip100" data-tooltip="Twitter">
                        <i class="fa fa-twitter"></i>
                    </a>

                    <a href="#" class="fs-14 cl3 hov-cl1 trans-04 lh-10 p-lr-5 p-tb-2 m-r-8 tooltip100" data-tooltip="Google Plus">
                        <i class="fa fa-google-plus"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
