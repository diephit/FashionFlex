<!DOCTYPE html>
<html lang="en">
<head>
	<title>Verify Email - FashionFlex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="../../images/icons/favicon.png"/>
	<link rel="stylesheet" href="../../vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="../../fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="../../css/util.css">
	<link rel="stylesheet" href="../../css/main.css">
	<style>
		.auth-container {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			padding: 40px 15px;
		}
		.auth-box {
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.2);
			max-width: 500px;
			width: 100%;
			padding: 40px;
			text-align: center;
		}
		.auth-icon {
			width: 80px;
			height: 80px;
			border-radius: 50%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 36px;
			margin: 0 auto 20px;
		}
	</style>
</head>
<body>

	<div class="auth-container">
		<div class="auth-box">
			<div class="auth-icon">
				<i class="fa fa-envelope-o"></i>
			</div>
			<h2 style="font-family: Poppins-Bold; margin-bottom: 10px;">Verify Your Email</h2>
			<p style="color: #999; margin-bottom: 30px; font-family: Poppins-Regular;">
				We've sent a verification email to <strong>john@example.com</strong>.
				Please check your inbox and click the verification link.
			</p>

			<div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
				<p style="margin: 0; font-family: Poppins-Regular; color: #666;">
					<i class="fa fa-info-circle"></i> Didn't receive the email?
				</p>
			</div>

			<button class="flex-c-m stext-101 cl0 size-116 bg3 bor14 hov-btn3 p-lr-15 trans-04 pointer"
				style="width: 100%; margin-bottom: 15px;" onclick="resendEmail()">
				Resend Verification Email
			</button>

			<div>
				<a href="../../login.html" style="color: #717fe0; font-family: Poppins-Medium; text-decoration: none;">
					<i class="fa fa-arrow-left"></i> Back to Login
				</a>
			</div>
		</div>
	</div>

	<script src="../../vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="../../vendor/sweetalert/sweetalert.min.js"></script>
	<script>
		function resendEmail() {
			swal("Email Sent!", "A new verification email has been sent to your inbox.", "success");
		}
	</script>

</body>
</html>
