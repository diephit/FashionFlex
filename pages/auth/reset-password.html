<!DOCTYPE html>
<html lang="en">
<head>
	<title>Reset Password - FashionFlex</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="../../images/icons/favicon.png"/>
	<link rel="stylesheet" href="../../vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="../../fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="../../css/util.css">
	<link rel="stylesheet" href="../../css/main.css">
	<style>
		.auth-container {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			padding: 40px 15px;
		}
		.auth-box {
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.2);
			max-width: 500px;
			width: 100%;
			padding: 40px;
		}
		.auth-icon {
			width: 80px;
			height: 80px;
			border-radius: 50%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 36px;
			margin: 0 auto 20px;
		}
	</style>
</head>
<body>

	<div class="auth-container">
		<div class="auth-box">
			<div class="auth-icon">
				<i class="fa fa-key"></i>
			</div>
			<h2 style="text-align: center; font-family: Poppins-Bold; margin-bottom: 10px;">Reset Password</h2>
			<p style="text-align: center; color: #999; margin-bottom: 30px; font-family: Poppins-Regular;">
				Enter your new password below.
			</p>

			<form>
				<div style="margin-bottom: 20px;">
					<label style="display: block; font-family: Poppins-Medium; margin-bottom: 8px;">New Password</label>
					<input type="password" class="stext-111 cl2 plh3 size-116 p-l-15 p-r-15"
						placeholder="Enter new password" required
						style="width: 100%; border: 1px solid #e6e6e6; border-radius: 4px;">
				</div>

				<div style="margin-bottom: 20px;">
					<label style="display: block; font-family: Poppins-Medium; margin-bottom: 8px;">Confirm Password</label>
					<input type="password" class="stext-111 cl2 plh3 size-116 p-l-15 p-r-15"
						placeholder="Confirm new password" required
						style="width: 100%; border: 1px solid #e6e6e6; border-radius: 4px;">
				</div>

				<button type="submit" class="flex-c-m stext-101 cl0 size-116 bg3 bor14 hov-btn3 p-lr-15 trans-04 pointer"
					style="width: 100%; margin-bottom: 15px;">
					Reset Password
				</button>

				<div style="text-align: center;">
					<a href="../../login.html" style="color: #717fe0; font-family: Poppins-Medium; text-decoration: none;">
						<i class="fa fa-arrow-left"></i> Back to Login
					</a>
				</div>
			</form>
		</div>
	</div>

	<script src="../../vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="../../vendor/sweetalert/sweetalert.min.js"></script>
	<script>
		$('form').on('submit', function(e) {
			e.preventDefault();
			swal("Success!", "Your password has been reset successfully.", "success").then(() => {
				window.location.href = '../../login.html';
			});
		});
	</script>

</body>
</html>
